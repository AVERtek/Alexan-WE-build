<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<script>
    function openRecordingTab() {
    const recWin = window.open("", "_blank");
    recWin.document.write(`
    <html><head><title>Project Recorder</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"><\/script>
    <style>
        body { margin: 0; background: #ffff99; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; text-align: center; padding: 10px; box-sizing: border-box; }
        /* Focus strictly on 2D view */
        model-viewer { width: 100%; height: 50vh; --progress-bar-color: #59cbe8; background-color: #ffff99; }
        .instr { background: white; padding: 15px 25px; border-radius: 12px; border: 3px solid #59cbe8; width: 95%; max-width: 600px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; }
        .instr p { font-size: 18px; font-weight: bold; color: #ff69b4; margin: 8px 0; display: flex; align-items: center; justify-content: center; }
        .play-btn { display: inline-block !important; min-width: 250px; height: 60px; background: #59cbe8; color: white; border-radius: 10px; font-size: 22px; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; padding: 0 40px; line-height: 60px; }
        .rec-img { height: 24px; vertical-align: middle; margin-left: 8px; }
    </style></head>
    <body>
        <model-viewer id="m" 
            src=" Models/entire_family_99cm.glb" 
            poster="images/Poster_SN_Scene.png" 
            reveal="auto" loading="eager" interaction-prompt="none" camera-controls>
        </model-viewer>
        <audio id="music" src="Sound/sweet_neighbor_of_mine3.mp3" loop></audio>
        <div class="instr">
            <p>SCREEN RECORD iOS: Swipe down top-right & tap <img src="images/iPhone Record Button 9.png" class="rec-img"></p>
            <p>ANDROID: Swipe down twice & tap "Screen Record"</p>
            <button id="ctrl" class="play-btn" onclick="
                const a=document.getElementById('music'); 
                const m=document.getElementById('m'); 
                if(a.paused){
                    a.play(); 
                    m.play(); 
                    m.dismissPoster();
                    this.innerText='  ❚❚   PAUSE'; 
                    this.style.background='#ff69b4';
                } else {
                    a.pause(); 
                    m.pause(); 
                    this.innerText='  ▶   START SHOW'; 
                    this.style.background='#59cbe8';
                }
            ">  ▶   START SHOW</button>
        </div>
    </body></html>`);
    recWin.document.close();
}
    document.addEventListener("DOMContentLoaded", function () {
        const video = document.getElementById('video-overlay');
        const playBtn = document.getElementById('play-pause-button');
        const mv = document.getElementById('reveal');

        function toggleVideo() {
            if (video.paused) { video.play(); video.muted = false; playBtn.style.display = "none"; }
            else { video.pause(); playBtn.style.display = "block"; }
        }

        playBtn.addEventListener('click', toggleVideo);
        video.addEventListener('click', toggleVideo);

        function openPdfInNewTab(blob, certificateNumber) {
            const url = URL.createObjectURL(blob);
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                const a = document.createElement('a');
                a.href = url;
                a.download = `SweetNeighborCertificate_${certificateNumber}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } else {
                const newWindow = window.open(url, '_blank');
                if (!newWindow) alert('Please allow pop-ups to view the certificate.');
            }
        }

        document.getElementById('viewPrintCertificateButton').addEventListener('click', async () => {
            const { PDFDocument, rgb, StandardFonts } = PDFLib;
            try {
                const bytes = await fetch('certificates/sugarlump_app_certificate.pdf').then(res => res.arrayBuffer());
                const pdfDoc = await PDFDocument.load(bytes);
                const page = pdfDoc.getPages()[0];
                const { height } = page.getSize();
                const fontB = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
                const fontR = await pdfDoc.embedFont(StandardFonts.Helvetica);
                
                const now = new Date();
                const dateStr = now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                const exp = new Date(); exp.setDate(now.getDate() + 31);
                const expStr = exp.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                const certNo = Date.now().toString().slice(-8);

                const x = 80; const baseY = height - 250;
                page.drawText("Tercek Real Estate Group", { x, y: baseY + 20, size: 16, font: fontB, color: rgb(8/255, 119/255, 144/255) });
                page.drawText("Sweet Neighbor of Mine", { x, y: baseY, size: 16, font: fontB, color: rgb(254/255, 63/255, 178/255) });
                page.drawText(`Certificate No: ${certNo}`, { x, y: baseY - 20, size: 12, font: fontR, color: rgb(8/255, 119/255, 144/255) });
                page.drawText(`Download Date: ${dateStr}`, { x, y: baseY - 40, size: 12, font: fontR, color: rgb(8/255, 119/255, 144/255) });
                page.drawText(`Valid until: ${expStr}`, { x, y: baseY - 60, size: 14, font: fontB, color: rgb(0.8, 0.2, 0.2) });

                const pdfData = await pdfDoc.save();
                openPdfInNewTab(new Blob([pdfData], { type: 'application/pdf' }), certNo);
            } catch (e) { alert("Error loading certificate template."); }
        });

        document.getElementById('ar-button').addEventListener('click', () => {
            if (mv.canActivateAR) { mv.activateAR(); } 
            else { alert("AR features require a mobile device."); }
        });
    });
</script>
